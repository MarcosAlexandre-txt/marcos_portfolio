name: Publicar portfólio no GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar autorização dos materiais
        env:
          STATUE_LICENSE_CONFIRMED: ${{ vars.STATUE_LICENSE_CONFIRMED }}
          MUSIC_DISTRIBUTION_CONFIRMED: ${{ vars.MUSIC_DISTRIBUTION_CONFIRMED }}
        run: |
          test "$STATUE_LICENSE_CONFIRMED" = true || { echo 'Confirme a autoria/licença da fotografia das estátuas antes de publicar.'; exit 1; }
          test "$MUSIC_DISTRIBUTION_CONFIRMED" = true || { echo 'Documente os termos de distribuição pública da música antes de publicar.'; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Configurar endereço do site
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "ASTRO_SITE=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo 'ASTRO_BASE=/' >> "$GITHUB_ENV"
          else
            echo "ASTRO_BASE=/${REPO}" >> "$GITHUB_ENV"
          fi
      - run: bun run check
      - run: bun run build
      - run: bun test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
